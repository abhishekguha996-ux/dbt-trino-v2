coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
query.max-memory=1GB
query.max-memory-per-node=1GB
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino-generated/server.pem
http-server.authentication.type=PASSWORD,JWT
http-server.authentication.allow-insecure-over-http=true
http-server.authentication.jwt.key-file=/etc/trino-generated/jwt-public.pem
internal-communication.shared-secret=dbt-trino-lab-internal-secret-not-for-production
