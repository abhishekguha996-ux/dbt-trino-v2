version: 2
models:
  - name: fct_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
  - name: customer_lifetime_value
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: daily_sales
    columns:
      - name: order_date
        data_tests: [unique, not_null]
